<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひみつ指令ゼロ ― ちきゅう探偵団</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0f1b2d; --paper:#f6ecd2; --paper-edge:#d9c79c; --ink:#2b2118; --red:#d6453d; --gold:#f2b632;
    --sea:#123250; --land:#7fbf6a; --land-edge:#3e7a3a; --other:#4d6f5a; --teal:#2a9d8f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:#fff;
    background:radial-gradient(circle at 20% 0%,#22406a 0%,var(--night) 55%) fixed;-webkit-tap-highlight-color:transparent}
  .nw{white-space:nowrap;display:inline-block}
  .ph{display:inline-block}
  p,small,.fact{text-wrap:pretty}
  rt{font-size:.55em;font-weight:700;opacity:.85}
  button{font:inherit}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  /* 時計・Dynamic Island の帯：スクロールした内容がもぐりこまないように覆う */
  body::before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#0f1b2d;z-index:9;pointer-events:none}
  .app{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));min-height:100%;display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{font-family:"DotGothic16",monospace;font-size:clamp(18px,3.4vw,26px);letter-spacing:.06em;white-space:nowrap}
  .logo b{color:var(--gold)}
  .status{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
  .pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;white-space:nowrap;color:#fff;font-weight:700}
  button.pill{cursor:pointer}
  @media (max-width:560px){header{flex-wrap:wrap}.status{gap:5px;font-size:12px;flex-wrap:wrap}.pill{padding:5px 9px}}
  @media (max-width:480px){.lbl{display:none}.status{gap:4px}.pill{padding:5px 8px}}

  .main{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px;flex:1}
  @media (max-width:760px){
    .main{grid-template-columns:1fr}
    /* スマホ：指令書の空白を詰めて、地図を上に */
    .order .typed{min-height:0;line-height:1.6;font-size:16px}
    .order .msg{min-height:0;margin-top:6px}
    .order .msg:empty{display:none}
    section.order{padding:14px 16px 12px}
    .order h2{margin-bottom:6px}
  }
  /* タブレット縦向き：指令書を上、地図を横いっぱいに */
  @media (min-width:761px) and (orientation:portrait){
    .main{grid-template-columns:1fr}
    .order .typed{min-height:5.4em}
    svg{max-height:calc(100vh - 330px)}
  }

  .order{background:var(--paper);color:var(--ink);border-radius:6px;padding:18px 18px 16px;position:relative;align-self:start;
    box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 2px var(--paper-edge);
    background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(0,0,0,.05) 27px 28px)}
  .stamp{position:absolute;top:12px;right:12px;border:3px solid var(--red);color:var(--red);font-weight:800;padding:2px 8px;transform:rotate(8deg);font-size:13px;border-radius:4px;opacity:.85}
  .order h2{margin:0 0 10px;font-family:"DotGothic16",monospace;font-size:18px;letter-spacing:.08em}
  .modetag{display:inline-block;font-size:12px;background:var(--night);color:var(--gold);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;font-family:"M PLUS Rounded 1c",sans-serif}
  .typed{font-family:"DotGothic16",monospace;font-size:17px;line-height:1.8;min-height:7.2em;white-space:pre-wrap}
  .coord{display:inline-block;background:var(--ink);color:var(--gold);padding:0 6px;border-radius:3px;letter-spacing:.05em}
  .cursor{display:inline-block;width:.55em;background:var(--ink);animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .msg{margin-top:12px;font-weight:700;font-size:16px;min-height:2.6em;line-height:1.5}
  .msg.ok{color:#1f7a35}.msg.ng{color:var(--red)}
  .btn,.hint-btn{font-weight:800;border:none;border-radius:14px;cursor:pointer;padding:12px 18px;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
  .btn:active,.hint-btn:active,.zoomout:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .hint-btn{background:#fff;color:var(--ink);border:2px solid var(--paper-edge);margin-top:6px;font-size:15px;padding:8px 14px}
  .btn{background:var(--gold);color:var(--ink)}
  .btn.red{background:var(--red);color:#fff}
  .btn.teal{background:var(--teal);color:#fff}

  .mapwrap{position:relative;background:var(--sea);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.08);touch-action:manipulation}
  svg{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);cursor:crosshair}
  .land-jp{fill:var(--land);stroke:var(--land-edge);stroke-width:1;vector-effect:non-scaling-stroke}
  .lake{fill:#1b4870;stroke:var(--land-edge);stroke-width:1;vector-effect:non-scaling-stroke}
  .pref-border{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.1;stroke-dasharray:4 3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .land-other{fill:var(--other);stroke:#2e4a3b;stroke-width:1;vector-effect:non-scaling-stroke}
  line{vector-effect:non-scaling-stroke}
  .gl{stroke:rgba(255,255,255,.2);stroke-width:1}
  .gl.fine{stroke:rgba(255,255,255,.17)}
  .gl.half{stroke:rgba(255,255,255,.35);stroke-width:1.2}
  .gl.main{stroke:rgba(242,182,50,.6);stroke-width:1.6;stroke-dasharray:6 5}
  .hl{stroke:var(--gold);stroke-width:4;opacity:.95}
  .glab{fill:rgba(255,255,255,.8);font-weight:700;font-family:"M PLUS Rounded 1c",sans-serif;paint-order:stroke;stroke:rgba(18,50,80,.85);stroke-linejoin:round}
  .glab.main{fill:var(--gold)}
  .tap{fill:#fff;stroke:var(--red);vector-effect:non-scaling-stroke;stroke-width:3}
  .ring{fill:none;stroke:var(--gold);stroke-width:4;vector-effect:non-scaling-stroke;animation:pulse 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.2);opacity:0}}
  .lens{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
  .readout{position:absolute;left:10px;bottom:10px;right:76px;background:rgba(15,27,45,.85);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:10px;font-weight:700;font-size:15px;pointer-events:none;width:fit-content}
  .compass{position:absolute;right:10px;bottom:10px;background:rgba(15,27,45,.8);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.2);pointer-events:none;text-align:center;line-height:1.1}
  .zoomout{position:absolute;right:10px;top:40px;display:none;background:#fff;color:var(--ink);border:none;border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .zoomout.show{display:block}

  .overlay{position:fixed;inset:0;background:rgba(5,10,20,.72);display:none;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:10}
  .overlay.show{display:grid;animation:fade .25s}
  @keyframes fade{from{opacity:0}}
  .card{background:var(--paper);color:var(--ink);border-radius:18px;max-width:460px;width:100%;padding:24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-height:92vh;overflow:auto}
  .card.wide{max-width:780px}
  @keyframes pop{from{transform:scale(.7)}}
  .card .big{font-size:64px;line-height:1.1}
  .card h3{margin:6px 0 4px;font-size:24px}
  .card p{font-size:16px;line-height:1.7;margin:8px 0 16px}
  .card .fact{background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-size:15px;border:2px dashed var(--paper-edge)}
  .rank{display:inline-block;background:var(--night);color:var(--gold);padding:6px 14px;border-radius:999px;font-weight:800;margin:6px 0 4px}
  .modes{display:grid;gap:12px;margin-top:8px}
  .modebtn{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--paper-edge);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .modebtn:hover{border-color:var(--gold)}
  .modebtn .e{font-size:40px}
  .modebtn b{font-size:18px;display:block}
  .modebtn small{font-size:13px;line-height:1.5;display:block;color:#5a4a36}
  .lv{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:4px;color:#fff;vertical-align:middle}
  .book{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;text-align:center}
  .bk{background:#e9dcbc;border-radius:10px;padding:8px 6px;color:#8a7a5a}
  .bk.on{background:#fff;color:var(--ink);border:2px solid var(--gold)}
  .bk .e{font-size:28px}.bk .c{font-size:11px;font-weight:700}.bk .p{font-size:12px;line-height:1.3;margin-top:2px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .shake{animation:shake .4s}
  /* USB */
  .usbs{display:inline-flex;gap:3px;align-items:center}
  .usbs svg{display:block}
  .usb-big{display:inline-block;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .letter{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--night);color:var(--gold);font-family:"DotGothic16",monospace;font-size:26px;margin:0 4px;vertical-align:middle}
  /* 端末 */
  .card.term{background:#071a12;color:#7dffb2;font-family:"DotGothic16",monospace;border:3px solid #1f5b3e;box-shadow:0 0 40px rgba(60,255,150,.25),0 20px 50px rgba(0,0,0,.5)}
  .term h3{color:#b8ffd6;font-family:"DotGothic16",monospace;letter-spacing:.06em}
  .term p{color:#7dffb2}
  .term .scr{background:#03110b;border:2px solid #1f5b3e;border-radius:10px;padding:12px;text-align:left;line-height:1.7;min-height:4.5em;font-size:15px}
  .slots{display:flex;gap:8px;justify-content:center;margin:14px 0 8px;flex-wrap:wrap}
  .slot{width:48px;height:64px;border:2px dashed #2f7d57;border-radius:10px;display:grid;place-items:center;transition:all .25s}
  .slot.in{border-style:solid;border-color:#7dffb2;background:rgba(125,255,178,.08);box-shadow:0 0 12px rgba(125,255,178,.35)}
  .gauge{height:16px;border-radius:999px;background:#0c2a1c;border:2px solid #1f5b3e;overflow:hidden;margin:10px 0}
  .gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ddc84,#b8ffd6);transition:width .5s}
  .btn.term-btn{background:#3ddc84;color:#04120b}
  .tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .tile{width:52px;height:56px;border-radius:10px;border:2px solid #7dffb2;background:#0c2a1c;color:#d9ffe9;font-family:"DotGothic16",monospace;font-size:28px;cursor:pointer;display:grid;place-items:center;padding:0}
  .tile:disabled{opacity:.25;cursor:default}
  .tile.ans{border-style:dashed;cursor:pointer}
  .tile.ans.fixed{border-color:var(--gold);color:var(--gold)}
  .door{font-size:72px;line-height:1.1}
  .agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;text-align:center}
  .ag{background:#e9dcbc;border-radius:12px;padding:10px 8px;color:#8a7a5a}
  .ag.on{background:#fff;color:var(--ink);border:2px solid var(--gold)}
  .ag .e{font-size:40px}.ag b{display:block;font-size:15px}.ag small{display:block;font-size:12px;line-height:1.4;margin-top:2px}
  .brief{background:var(--night);color:#fff;border-radius:14px;padding:14px 16px;text-align:left;line-height:1.8;font-size:15px}
  .brief b{color:var(--gold)}
  .alert{display:inline-block;background:var(--red);color:#fff;font-weight:800;padding:3px 12px;border-radius:999px;letter-spacing:.1em}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">ひみつ<ruby>指令<rt>しれい</rt></ruby> <b>ゼロ</b></div>
    <div class="status">
      <button class="pill" id="menuBtn">🏠<span class="lbl"> メニュー</span></button>
      <button class="pill" id="soundBtn" aria-label="音のオン・オフ">🔊</button>
      <button class="pill" id="bookBtn">📖 図鑑</button>
      <span class="pill" id="missionNo">指令 1 / 5</span>
      <span class="pill usbs" id="usbBar" aria-label="集めたUSBメモリー"></span>
    </div>
  </header>

  <div class="main">
    <section class="order" id="order">
      <div class="stamp">極秘</div>
      <h2>📜 <ruby>指令書<rt>しれいしょ</rt></ruby><span class="modetag" id="modeTag"></span></h2>
      <div class="typed" id="typed"></div>
      <div class="msg" id="msg"></div>
      <button class="hint-btn" id="hintBtn">🔍 ヒントを見る</button>
    </section>

    <section class="mapwrap">
      <svg id="map" viewBox="0 0 971 1056" role="img" aria-label="日本の地図。緯度と経度の線つき"></svg>
      <button class="zoomout" id="zoomOut">🗾 全体にもどる</button>
      <div class="compass">↑<br>北</div>
      <div class="readout" id="readout">地図をタップして場所をえらぼう</div>
    </section>
  </div>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

function tone(seq) {

    if (actx.state === 'suspended') actx.resume();

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

    }
  } catch (e) {}
}

    const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
    if (!H) return;

function updateSoundBtn() { document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇'; }

// ===== 距離・方角 =====
const R = 6371, rad = d => d * Math.PI / 180;
const distKm = (a, b, c, d) => 2 * R * Math.asin(Math.sqrt(Math.sin(rad(c - a) / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(rad(d - b) / 2) ** 2));
function dirWord(la, lo, tla, tlo, th) {
  const ns = tla - la > th ? '北' : tla - la < -th ? '南' : '';
  const ew = tlo - lo > th ? '東' : tlo - lo < -th ? '西' : '';
  return ns + ew;
}

// ===== タイプライター =====
const typed = document.getElementById('typed');
let typingTimer, ready = false;
function typeOut(text, coordHTML) {
  clearInterval(typingTimer); typed.innerHTML = '';
  let i = 0;
  const span = document.createElement('span'); typed.appendChild(span);
  const cur = document.createElement('span'); cur.className = 'cursor'; cur.innerHTML = '&nbsp;'; typed.appendChild(cur);
  typingTimer = setInterval(() => {
    span.textContent = text.slice(0, ++i);
    if (i % 2 === 0) SFX.type();
    if (i >= text.length) {
      clearInterval(typingTimer); cur.remove();
      const c = document.createElement('div'); c.innerHTML = '\n▶ 目標地点：' + coordHTML; typed.appendChild(c);
      ready = true;
      try { if (window.__bx) window.__bx.applyToElement(span); } catch (e) {}
    }
  }, 40);
}

// ===== ゲーム進行 =====
let idx = 0, tries = 0, stars = 0, hintLevel = 0;
const msg = document.getElementById('msg'), readout = document.getElementById('readout');
new MutationObserver(() => { if (msg.firstChild && !msg.querySelector('[data-bx]') && window.__bx) { try { window.__bx.applyToElement(msg); } catch (e) {} } }).observe(msg, { childList: true });
const defaultReadout = () => M.zoom ? '地図をタップすると、虫めがねで拡大するよ' : '地図をタップして場所をえらぼう';

function startMission() {
  const m = MISSIONS[idx];
  tries = 0; hintLevel = 0; ready = false;
  hintG.innerHTML = ''; marks.innerHTML = ''; lensG.innerHTML = ''; pinsG.innerHTML = '';
  msg.className = 'msg'; msg.textContent = '';
  if (zoomed()) setView({ ...FULL });
  document.getElementById('missionNo').textContent = `指令 ${idx + 1} / ${MISSIONS.length}`;
  readout.textContent = defaultReadout();
  typeOut(introFor(idx, m), coordText(m));
}
function hintLine(isLat, v) {
  const [x, y] = toXY(v, v);
  if (isLat) el('line', { x1: 0, x2: W, y1: y, y2: y, class: 'hl' }, hintG);
  else el('line', { x1: x, x2: x, y1: 0, y2: H, class: 'hl' }, hintG);
}
function between(v, word) {
  if (Number.isInteger(v)) return '';
  const lo = Math.floor(v), hi = lo + 1, f = Math.round((v - lo) * 10);
  if (f === 5) return `（${lo}度と${hi}度の、ちょうどまんなか）`;
  return `（${lo}度と${hi}度のあいだで、${f > 5 ? hi : lo}度に近いほう）`;
}
document.getElementById('hintBtn').onclick = () => {
  const m = MISSIONS[idx];
  hintLevel = Math.min(hintLevel + 1, 2);
  if (hintLevel === 1) {
    hintLine(true, m.lat);
    msg.className = 'msg'; msg.innerHTML = `ヒント①：<b>北緯${fmt(m.lat)}度</b>の横の線を光らせたよ。${between(m.lat, '')}`;
  } else {
    hintLine(false, m.lon);
    msg.className = 'msg'; msg.innerHTML = `ヒント②：<b>東経${fmt(m.lon)}度</b>のたての線も光らせたよ。${between(m.lon, '')}2本が交わるところをタップ！`;
  }
};

svg.addEventListener('click', e => {
  if (!ready) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const [lon, lat] = toLL(p.x, p.y);
  const m = MISSIONS[idx];

  // 都道府県編：まず虫めがねで拡大
  if (M.zoom && !zoomed()) {
    zoomTo(lon, lat); SFX.zoom();
    readout.textContent = '🔍 拡大した！ 細かい線で場所をよく見てタップしよう';
    return;
  }
  readout.textContent = `きみがえらんだのは 北緯${lat.toFixed(1)}度・東経${lon.toFixed(1)}度 あたり`;
  marks.innerHTML = '';
  addMark('circle', p.x, p.y, 9, 'tap');
  const km = distKm(lat, lon, m.lat, m.lon);
  tries++;
  if (km <= M.tol) {
    ready = false;
    const earned = tries === 1 && hintLevel === 0 ? 3 : tries <= 3 ? 2 : 1;
    stars += earned;
    const lo = letterOrder[usbs.length] || { ch: '★', i: -1 };
    usbs.push({ color: earned === 3 ? 'gold' : earned === 2 ? 'silver' : 'bronze', ch: lo.ch, i: lo.i });
    found[mode].add(keyOf(m)); saveFound(); updateBook();
    const [x, y] = toXY(m.lon, m.lat);
    addMark('circle', x, y, 16, 'ring');
    addPin(m);
    msg.className = 'msg ok'; msg.textContent = '🎯 地点を特定した！'; SFX.ok();
    updateUsbBar();
    setTimeout(() => showFound(m, earned), 800);
  } else {
    const order = document.getElementById('order');
    order.classList.remove('shake'); void order.offsetWidth; order.classList.add('shake'); SFX.ng();
    const dir = dirWord(lat, lon, m.lat, m.lon, M.zoom ? 0.05 : 0.4);
    msg.className = 'msg ng';
    msg.innerHTML = km < 200
      ? `おしい！あと <b>${km < 10 ? km.toFixed(1) : Math.round(km)}km</b>。もう少し<b>${dir}</b>だ！`
      : `ちがうみたい…。目標はもっと<b>${dir}</b>のほうだ！（あと${Math.round(km)}km）`;
    // 目標が拡大画面の外なら、全体にもどす
    if (M.zoom && zoomed()) {
      const [tx, ty] = toXY(m.lon, m.lat);
      if (tx < view.x || tx > view.x + view.w || ty < view.y || ty > view.y + view.h) {
        msg.innerHTML += '<br>🗾 全体の地図にもどったよ。';
        setTimeout(() => setView({ ...FULL }), 600);
        readout.textContent = defaultReadout();
      }
    }
    if (tries === 3 && hintLevel === 0) msg.innerHTML += '<br>🔍 こまったら「ヒントを見る」をおしてね';
  }
});

function updateBook() { document.getElementById('bookBtn').innerHTML = `📖<span class="lbl"> 図鑑</span> ${found[mode].size}/${M.pool.length}`; }

const overlay = document.getElementById('overlay'), card = document.getElementById('card');
// 日本語の改行を、ことばの区切りで行う（BudouX）
function bx(root) {
  if (!window.__bx || !root) return;
  root.querySelectorAll('p,h3,.scr,.brief,small,.p,.fact,.msg-in').forEach(el => {
    if (el.dataset.bx || el.parentElement.closest('[data-bx]') || el.querySelector('ruby')) return;
    try { window.__bx.applyToElement(el); el.dataset.bx = '1'; } catch (e) {}
  });
}
new MutationObserver(() => bx(card)).observe(card, { childList: true });
function openCard(html, wide = false) { card.innerHTML = html; card.classList.toggle('wide', wide); card.classList.remove('term'); overlay.classList.add('show'); }
function closeCard() { overlay.classList.remove('show'); }

function showFound(m, earned) {
  openCard(`
    <div class="big">${m.emoji}</div>
    <h3>${phr(m.title)}</h3>
    <p class="fact">💡 ${m.fact}</p>
    <p style="margin:10px 0 6px"><span class="usb-big">${usbSvg(usbs.at(-1).color, 54)}</span><br>
    <span class="ph"><b>${USBC[usbs.at(-1).color].name}のUSBメモリー</b>を</span><span class="ph">手に入れた！</span><br>
    <span class="nw">中に入っていた</span><span class="nw">文字：</span><span class="letter">${usbs.at(-1).ch}</span></p>
    <button class="btn" id="nextBtn">${idx < MISSIONS.length - 1 ? '次の指令へ ▶' : '救出に向かう ▶'}</button>`);
  document.getElementById('nextBtn').onclick = () => {
    closeCard(); idx++;
    if (idx < MISSIONS.length) startMission(); else showClear();
  };
}
function showClear() {
  setView({ ...FULL }); drawFoundPins();
  showTerminal();
}
function termCard(html) { openCard(html); card.classList.add('term'); }
function showTerminal() {
  let inserted = 0;
  const draw = () => {
    termCard(`
      <h3>▶ ロック解除端末</h3>
      <div class="scr" id="scr">${inserted === 0 ? `&gt; <span class="ph">${agent.name}が</span><span class="ph">閉じこめられた</span><span class="ph">部屋のロックを</span><span class="ph">発見。</span><br>&gt; <span class="ph">USBメモリーを</span><span class="ph">${PER}本</span><span class="ph">差しこんでください。</span>` : `&gt; <span class="ph">USB ${inserted}本目を</span><span class="ph">読みこみ中…</span><br>&gt; <span class="ph">ロック解除</span> <span class="ph">${inserted * 20}%</span>`}</div>
      <div class="slots">${Array.from({ length: PER }, (_, i) => `<div class="slot${i < inserted ? ' in' : ''}">${i < inserted ? usbSvg(usbs[i].color, 52, usbs[i].ch) : ''}</div>`).join('')}</div>
      <div class="gauge"><i style="width:${inserted * 20}%"></i></div>
      <button class="btn term-btn" id="insBtn">${inserted < PER ? `USBを差しこむ（${inserted + 1}本目）` : 'パスワード入力へ ▶'}</button>`);
    document.getElementById('insBtn').onclick = () => {
      if (inserted < PER) { inserted++; tone([[400 + inserted * 120, .08, 'square'], [600 + inserted * 120, .1, 'square']]); buzz('tap'); draw(); }
      else showPassword();
    };
  };
  draw();
}
function showPassword() {
  const n = PER;
  let picked = [], misses = 0, fixed = 0;   // fixed = 最初から正しく入れておく文字数（ヒント）
  const word = [...agent.word];
  const draw = (msg = '') => {
    termCard(`
      <h3>▶ パスワード入力</h3>
      <div class="scr">&gt; ${jp('USBの文字を、正しい順に並べると、パスワードになる。')}<br>&gt; <span class="ph">ヒント：</span>${jp(agent.hint)}${msg ? `<br>&gt; ${jp(msg)}` : ''}</div>
      <div class="tiles">${Array.from({ length: n }, (_, k) => {
        const u = picked[k];
        return `<button class="tile ans${k < fixed ? ' fixed' : ''}" data-k="${k}" aria-label="${k + 1}文字目">${u !== undefined ? usbs[u].ch : '＿'}</button>`; }).join('')}</div>
      <div style="font-size:13px;margin-top:4px">▼ USBの文字をタップ</div>
      <div class="tiles">${usbs.map((u, j) => `<button class="tile" data-j="${j}" ${picked.includes(j) ? 'disabled' : ''}>${u.ch}</button>`).join('')}</div>
      <div class="row" style="margin-top:8px"><button class="btn term-btn" id="clrBtn" style="font-size:14px;padding:8px 14px">やり直す</button></div>`);
    card.querySelectorAll('.tile[data-j]').forEach(b => b.onclick = () => {
      const j = +b.dataset.j; if (picked.includes(j)) return;
      picked.push(j); SFX.tap(); if (picked.length === n) check(); else draw(msg);
    });
    card.querySelectorAll('.tile.ans').forEach(b => b.onclick = () => {
      const k = +b.dataset.k; if (k < fixed || picked[k] === undefined) return;
      picked = picked.slice(0, k); SFX.tap(); draw(msg);
    });
    document.getElementById('clrBtn').onclick = () => { picked = picked.slice(0, fixed); draw(msg); };
  };
  // ヒント用：正しいk文字目のUSB番号
  const usbFor = (k, taken) => usbs.findIndex((u, j) => u.ch === word[k] && !taken.includes(j));
  const check = () => {
    const guess = picked.map(j => usbs[j].ch).join('');
    if (guess === agent.word) { SFX.clear(); return setTimeout(showRescue, 350); }
    misses++; SFX.ng();
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    if (misses >= 2 && fixed < n - 1) {
      fixed++;
      const keep = [];
      for (let k = 0; k < fixed; k++) keep.push(usbFor(k, keep));
      picked = keep;
      return draw(`ちがうようだ…。${fixed}文字目まで正しい文字を入れておいたぞ。`);
    }
    picked = picked.slice(0, fixed);
    draw('ちがうようだ…。もう一度ためしてみよう。');
  };
  draw();
}
function showRescue() {
  const golds = usbs.filter(u => u.color === 'gold').length;
  const rank = golds === PER ? '伝説のエージェント' : stars >= PER * 3 - 3 ? 'ベテランエージェント' : 'エージェント';
  const medal = golds === PER ? '🏆' : stars >= PER * 3 - 3 ? '🥇' : '🎖️';
  const first = !rescued[agent.id];
  const rec = rescued[agent.id] || { times: 0 };
  rec.times++;
  rec.best = Math.max(rec.best || 0, stars);
  rescued[agent.id] = rec; saveRescued();
  const all = rescuedCount() === AGENTS.length;
  closeCard();
  openCard(`
    <div class="door">🔓</div>
    <h3>ロック解除！</h3>
    <div class="big">${agent.emoji}</div>
    <p style="margin:4px 0 10px"><b>エージェント・${agent.name}</b><br>${jp('「' + agent.thanks + '」')}</p>
    <div class="rank">${medal} ${rank}</div>
    <p style="margin:8px 0">集めたUSB：${usbs.map(u => usbSvg(u.color, 26)).join(' ')}<br>
    パスワード：<b>${agent.word}</b><br>
    ${first ? `<span class="ph"><b>仲間ファイル</b>に</span><span class="ph">${agent.name}が</span><span class="ph">登録された！</span><span class="ph">（${rescuedCount()} / ${AGENTS.length}人）</span>` : `<span class="ph">${agent.name}を</span><span class="ph">${rec.times}回助けた！</span>`}
    ${all && first ? '<br>🎉 <b><span class="ph">全員の救出に成功！</span> <span class="ph">ちきゅう探偵団は</span><span class="ph">全員そろった！</span></b>' : ''}</p>
    <div class="row">
      <button class="btn red" id="againBtn">${rescuedCount() < AGENTS.length ? '次の仲間を助ける ▶' : 'もう一度出動する ▶'}</button>
      <button class="btn teal" id="toMenu">メニューへ</button>
    </div>`);
  document.getElementById('againBtn').onclick = () => { closeCard(); startRound(); };
  document.getElementById('toMenu').onclick = showMenu;
}
function showAgents() {
  const items = AGENTS.map(a => rescued[a.id]

  openCard(`<h3>👥 仲間ファイル</h3>

}
function showBriefing() {

    <span class="ph">部屋のロックを</span><span class="ph">開けるには、</span><span class="ph">日本各地に</span><span class="ph">かくされた</span><span class="ph"><b>USBメモリー${PER}本</b>が</span><span class="ph">必要だ。</span><br>
    <span class="ph">指令書の</span><span class="ph">緯度・経度から</span><span class="ph">場所を</span><span class="ph">見つけ出し、</span><span class="ph">USBを集めよ。</span></div>
    <button class="btn" id="goBtn" style="margin-top:14px">出動する ▶</button>`);
